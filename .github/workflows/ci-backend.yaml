name: CI Backend

# Builds and pushes the backend image, then commits the new tag into k8s/backend/deployment.yaml.
# ArgoCD (running in-cluster) detects that git commit and syncs it automatically -- this is the
# "CI does the build, ArgoCD does the deploy" GitOps split.
on:
  push:
    branches: [main]
    paths:
      - "app/backend/**"
      - ".github/workflows/ci-backend.yaml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        # Docker/GHCR repository paths must be all-lowercase, but github.repository_owner
        # is your literal GitHub username/org (e.g. "Vishal-CloudDevOps") and GitHub Actions
        # expressions have no built-in lowercase function -- so this converts it in a shell step.
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/eks-gitops-backend" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: .*eks-gitops-backend:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s/backend/deployment.yaml

      - name: Commit and push manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: update backend image to ${{ github.sha }}"
          git push
