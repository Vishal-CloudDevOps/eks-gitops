name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/workflows/ci-frontend.yaml"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/eks-gitops-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: .*eks-gitops-frontend:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s/frontend/deployment.yaml

      - name: Commit and push manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: update frontend image to ${{ github.sha }}"
          git push
