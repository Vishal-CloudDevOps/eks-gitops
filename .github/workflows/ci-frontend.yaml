name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/workflows/ci-frontend.yaml"

# Prevents two runs of THIS workflow (e.g. from two quick pushes) from racing each
# other's manifest-commit step. Doesn't affect ci-backend.yaml, which is a separate
# workflow -- that race is handled by the retry loop below instead.
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        # Docker/GHCR repository paths must be all-lowercase, but github.repository_owner
        # is your literal GitHub username/org (e.g. "Vishal-CloudDevOps") and GitHub Actions
        # expressions have no built-in lowercase function -- so this converts it in a shell step.
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/eks-gitops-frontend" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: .*eks-gitops-frontend:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s/frontend/deployment.yaml

      - name: Commit and push manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: update frontend image to ${{ github.sha }}"

          # ci-backend.yaml may be committing to main at the same time (both trigger
          # together if a push touches both app/backend/ and app/frontend/). Retry with
          # a rebase on conflict instead of failing outright.
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $i/5), pulling and retrying..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
