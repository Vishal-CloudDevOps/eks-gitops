# gp3 StorageClass backed by the EBS CSI driver installed via Terraform.
# Set as the cluster default so Postgres's PVC provisions automatically.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
