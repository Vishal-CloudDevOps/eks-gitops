# Tells the kube-prometheus-stack Prometheus instance to scrape the backend's /metrics
# endpoint. Requires the kube-prometheus-stack Helm chart (installed in README step 5)
# because it provides the ServiceMonitor CRD.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: app
  labels:
    # Must match the label the kube-prometheus-stack release selects on (release name below)
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
