server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxies API calls to the backend Service inside the cluster.
  # Update the namespace here if you change it from "app".
  location /api/ {
    proxy_pass http://backend.app.svc.cluster.local:80/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
